<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --zinc-950: #09090b;
      --zinc-900: #18181b;
      --zinc-800: #27272a;
      --zinc-700: #3f3f46;
      --zinc-600: #52525b;
      --zinc-500: #71717a;
      --zinc-400: #a1a1aa;
      --zinc-300: #d4d4d8;
      --zinc-100: #f4f4f5;
      --amber-400: #fbbf24;
      --amber-300: #fcd34d;
      --emerald-600: #059669;
      --red-400: #f87171;
      --red-500: #ef4444;
    }

    body {
      background: var(--zinc-950);
      color: var(--zinc-100);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── AUTH SCREENS ────────────────────────────────── */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-box {
      width: 100%;
      max-width: 360px;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--amber-400);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; color: var(--zinc-950);
      flex-shrink: 0;
    }
    .logo-name {
      font-weight: 600;
      color: white;
      letter-spacing: -0.02em;
      font-size: 15px;
    }
    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      color: var(--zinc-400);
      font-size: 13px;
    }
    .auth-fields { margin-top: 1.75rem; display: flex; flex-direction: column; gap: 16px; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--zinc-300);
      margin-bottom: 6px;
    }
    .field-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .field-row .field-label { margin-bottom: 0; }
    input[type="text"], input[type="email"], input[type="password"], textarea {
      width: 100%;
      background: var(--zinc-900);
      border: 1px solid var(--zinc-800);
      border-radius: 8px;
      padding: 0 12px;
      height: 40px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    textarea {
      height: auto;
      padding: 10px 12px;
      resize: none;
    }
    input:focus, textarea:focus {
      border-color: var(--amber-400);
      box-shadow: 0 0 0 2px rgba(251,191,36,0.15);
    }
    input::placeholder, textarea::placeholder { color: var(--zinc-600); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; font-family: inherit;
      font-weight: 600; border-radius: 8px; transition: background 0.15s;
    }
    .btn-primary {
      background: var(--amber-400);
      color: var(--zinc-950);
      height: 40px; width: 100%;
      font-size: 14px; margin-top: 4px;
    }
    .btn-primary:hover { background: var(--amber-300); }
    .btn-sm {
      background: var(--amber-400);
      color: var(--zinc-950);
      height: 36px; padding: 0 20px;
      font-size: 13px;
    }
    .btn-sm:hover { background: var(--amber-300); }
    .forgot-btn {
      background: none; border: none; cursor: pointer;
      color: var(--amber-400); font-size: 12px;
    }
    .forgot-btn:hover { color: var(--amber-300); }
    .auth-footer {
      text-align: center; margin-top: 24px;
      font-size: 13px; color: var(--zinc-500);
    }
    .auth-link {
      background: none; border: none; cursor: pointer;
      color: var(--amber-400); font-weight: 500; font-size: 13px;
    }
    .auth-link:hover { color: var(--amber-300); }

    /* ── ALERT ────────────────────────────────────────── */
    .alert {
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px;
      display: none;
    }
    .alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--red-400); }
    .alert.success { background: rgba(5,150,105,0.1); border: 1px solid rgba(5,150,105,0.25); color: #34d399; }
    .alert.show { display: block; }

    /* ── APP LAYOUT ──────────────────────────────────── */
    #app-view { display: none; }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9,9,11,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(39,39,42,0.6);
    }
    .header-inner {
      max-width: 720px; margin: 0 auto; padding: 0 16px;
      height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 24px; height: 24px; font-size: 11px; }
    .pending-badge {
      background: rgba(251,191,36,0.12);
      color: var(--amber-400);
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }

    /* User menu */
    .user-menu { position: relative; }
    .user-trigger {
      display: flex; align-items: center; gap: 8px;
      background: none; border: none; cursor: pointer;
      padding: 4px 10px 4px 4px;
      border-radius: 100px;
      transition: background 0.15s;
    }
    .user-trigger:hover { background: rgba(39,39,42,0.6); }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--amber-400), #f97316);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--zinc-950);
      flex-shrink: 0;
    }
    .user-trigger span {
      font-size: 13px; color: var(--zinc-300); font-weight: 500;
    }
    .chevron {
      width: 14px; height: 14px; color: var(--zinc-500);
    }
    .dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: var(--zinc-900);
      border: 1px solid var(--zinc-800);
      border-radius: 10px;
      min-width: 200px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      overflow: hidden;
      display: none; z-index: 200;
    }
    .dropdown.open { display: block; }
    .dropdown-label {
      padding: 10px 14px;
      font-size: 11px; color: var(--zinc-500);
      border-bottom: 1px solid var(--zinc-800);
    }
    .dropdown-label strong { color: white; font-weight: 600; }
    .dropdown-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 10px 14px;
      background: none; border: none; cursor: pointer;
      font-size: 13px; color: var(--red-400);
      transition: background 0.12s;
      font-family: inherit; text-align: left;
    }
    .dropdown-item:hover { background: var(--zinc-800); color: var(--red-400); }

    /* ── MAIN CONTENT ────────────────────────────────── */
    main {
      max-width: 720px; margin: 0 auto;
      padding: 32px 16px;
    }

    /* New task card */
    .card {
      background: var(--zinc-900);
      border: 1px solid rgba(39,39,42,0.6);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      margin-bottom: 24px;
    }
    .card-header {
      padding: 20px 20px 0;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--zinc-500);
    }
    .card-body { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
    .card-body input { background: rgba(39,39,42,0.6); border-color: rgba(63,63,70,0.5); }
    .card-body textarea { background: rgba(39,39,42,0.6); border-color: rgba(63,63,70,0.5); }
    .card-actions { display: flex; justify-content: flex-end; }

    /* Task list header */
    .list-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .list-title {
      font-size: 13px; font-weight: 600; color: var(--zinc-300);
    }
    .list-count { color: var(--zinc-600); font-weight: 400; margin-left: 8px; }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--zinc-900);
      border: 1px solid var(--zinc-800);
      border-radius: 8px;
      padding: 3px; gap: 2px;
    }
    .tab {
      background: none; border: none; cursor: pointer;
      padding: 0 12px; height: 28px; border-radius: 6px;
      font-size: 12px; font-weight: 500; color: var(--zinc-400);
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }
    .tab.active {
      background: var(--zinc-700);
      color: white;
    }

    /* Task items */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--zinc-900);
      border: 1px solid rgba(39,39,42,0.6);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.15s;
      position: relative;
    }
    .task-item:hover { border-color: rgba(63,63,70,0.8); }
    .task-item.done { border-color: rgba(39,39,42,0.4); opacity: 0.6; }

    /* Custom checkbox */
    .checkbox-wrap {
      position: relative; flex-shrink: 0; margin-top: 2px;
    }
    .checkbox-wrap input[type="checkbox"] {
      position: absolute; opacity: 0; width: 0; height: 0;
    }
    .checkbox-custom {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1.5px solid var(--zinc-600);
      background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, border-color 0.12s;
    }
    .checkbox-wrap input:checked + .checkbox-custom {
      background: var(--amber-400);
      border-color: var(--amber-400);
    }
    .checkbox-custom svg { display: none; }
    .checkbox-wrap input:checked + .checkbox-custom svg { display: block; }

    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-size: 13px; font-weight: 500; color: var(--zinc-100);
      line-height: 1.4;
    }
    .task-title.done { text-decoration: line-through; color: var(--zinc-500); }
    .task-desc {
      font-size: 12px; color: var(--zinc-500);
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-meta {
      font-size: 11px; color: var(--zinc-700); margin-top: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .status-done { color: var(--emerald-600); }
    .status-pending { color: var(--zinc-500); }
    .meta-dot { color: var(--zinc-800); }

    .task-delete {
      background: none; border: none; cursor: pointer;
      color: var(--zinc-600); padding: 4px; border-radius: 6px;
      flex-shrink: 0; margin-top: 2px;
      opacity: 0; transition: opacity 0.15s, color 0.15s;
      display: flex;
    }
    .task-item:hover .task-delete { opacity: 1; }
    .task-delete:hover { color: var(--red-400); }

    /* Pagination */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 20px;
    }
    .page-btn {
      background: var(--zinc-900); border: 1px solid var(--zinc-800);
      color: var(--zinc-300); border-radius: 6px;
      padding: 0 12px; height: 32px; cursor: pointer;
      font-size: 12px; font-weight: 500;
      transition: background 0.12s; font-family: inherit;
    }
    .page-btn:hover:not(:disabled) { background: var(--zinc-800); }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
    .page-info { font-size: 12px; color: var(--zinc-500); }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 64px 16px;
      color: var(--zinc-600);
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-text { font-size: 13px; }

    /* Loading */
    .loading {
      text-align: center; padding: 32px;
      color: var(--zinc-600); font-size: 13px;
    }

    /* Hidden */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────── -->
<div id="login-view" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">T</div>
      <span class="logo-name">TaskFlow</span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>
    <div id="login-alert" class="alert error"></div>
    <div class="auth-fields">
      <div>
        <label class="field-label">Username</label>
        <input type="text" id="login-username" placeholder="your_username" autocomplete="username" />
      </div>
      <div>
        <div class="field-row">
          <label class="field-label">Password</label>
          <button class="forgot-btn">Forgot?</button>
        </div>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" onclick="login()">Sign in</button>
    </div>
    <p class="auth-footer">
      No account?
      <button class="auth-link" onclick="showView('register')">Create one</button>
    </p>
  </div>
</div>

<!-- ── REGISTER ───────────────────────────────────── -->
<div id="register-view" class="auth-screen hidden">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">T</div>
      <span class="logo-name">TaskFlow</span>
    </div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Get started — it takes 30 seconds</p>
    <div id="register-alert" class="alert error"></div>
    <div class="auth-fields">
      <div>
        <label class="field-label">Username</label>
        <input type="text" id="reg-username" placeholder="min. 3 characters" autocomplete="username" />
      </div>
      <div>
        <label class="field-label">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div>
        <label class="field-label">Password</label>
        <input type="password" id="reg-password" placeholder="min. 6 characters" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" onclick="register()">Create account</button>
    </div>
    <p class="auth-footer">
      Have an account?
      <button class="auth-link" onclick="showView('login')">Sign in</button>
    </p>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────── -->
<div id="app-view" class="hidden">
  <header>
    <div class="header-inner">
      <div class="header-left">
        <div class="logo-icon header-logo">T</div>
        <span class="logo-name">TaskFlow</span>
        <span id="pending-badge" class="pending-badge hidden"></span>
      </div>
      <div class="user-menu">
        <button class="user-trigger" onclick="toggleDropdown()">
          <div class="avatar" id="header-avatar"></div>
          <span id="header-username"></span>
          <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div class="dropdown" id="user-dropdown">
          <div class="dropdown-label">Signed in as <strong id="dropdown-username"></strong></div>
          <button class="dropdown-item" onclick="logout()">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- New task form -->
    <div class="card">
      <div class="card-header">New task</div>
      <div class="card-body">
        <input type="text" id="task-title" placeholder="What needs to be done?"
          onkeydown="if(event.key==='Enter') createTask()" />
        <textarea id="task-desc" rows="2" placeholder="Add a description… (optional)"></textarea>
        <div class="card-actions">
          <button class="btn btn-sm" onclick="createTask()">Add task</button>
        </div>
      </div>
    </div>

    <!-- Task list -->
    <div class="list-header">
      <div class="list-title">My Tasks <span class="list-count" id="task-count"></span></div>
      <div class="tabs">
        <button class="tab active" data-filter="all" onclick="setFilter('all', this)">All</button>
        <button class="tab" data-filter="pending" onclick="setFilter('pending', this)">Pending</button>
        <button class="tab" data-filter="completed" onclick="setFilter('completed', this)">Done</button>
      </div>
    </div>

    <div id="task-list-container">
      <div class="loading">Loading tasks…</div>
    </div>

    <div id="pagination" class="pagination hidden">
      <button class="page-btn" id="prev-btn" onclick="changePage(-1)">← Prev</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="next-btn" onclick="changePage(1)">Next →</button>
    </div>
  </main>
</div>

<script>
  const API = "";
  let token = localStorage.getItem("token") || null;
  let currentUser = localStorage.getItem("username") || null;
  let currentFilter = "all";
  let currentPage = 1;
  const PAGE_SIZE = 10;

  // ── Utils ──────────────────────────────────────────────
  function showView(view) {
    ["login-view","register-view","app-view"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById(view + "-view").classList.remove("hidden");
    clearAlerts();
  }

  function showAlert(id, msg, type = "error") {
    const el = document.getElementById(id);
    if (!el) return;
    if (Array.isArray(msg)) {
      msg = msg.map(e => e.msg || JSON.stringify(e)).join(", ");
    } else if (typeof msg === "object") {
      msg = JSON.stringify(msg);
    }
    el.textContent = msg;
    el.className = "alert " + type + " show";
  }

  function clearAlerts() {
    document.querySelectorAll(".alert").forEach(el => {
      el.className = "alert error";
      el.textContent = "";
    });
  }

  async function apiFetch(path, options = {}) {
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(API + path, { ...options, headers });
    let data;
    try { data = await res.json(); } catch { data = {}; }
    return { ok: res.ok, status: res.status, data };
  }

  // ── Auth ──────────────────────────────────────────────
  async function register() {
    const username = document.getElementById("reg-username").value.trim();
    const email    = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value;
    const { ok, data } = await apiFetch("/register", {
      method: "POST",
      body: JSON.stringify({ username, email, password })
    });
    if (!ok) { showAlert("register-alert", data.detail || "Registration failed"); return; }
    showAlert("register-alert", "Account created! Signing you in…", "success");
    setTimeout(() => loginWith(username, password), 800);
  }

  async function login() {
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    await loginWith(username, password);
  }

  async function loginWith(username, password) {
    const { ok, data } = await apiFetch("/login", {
      method: "POST",
      body: JSON.stringify({ username, password })
    });
    if (!ok) { showAlert("login-alert", data.detail || "Invalid credentials"); return; }
    token = data.access_token;
    currentUser = username;
    localStorage.setItem("token", token);
    localStorage.setItem("username", username);
    showApp();
  }

  function logout() {
    token = null; currentUser = null;
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    document.getElementById("user-dropdown").classList.remove("open");
    showView("login");
  }

  function toggleDropdown() {
    document.getElementById("user-dropdown").classList.toggle("open");
  }
  document.addEventListener("click", e => {
    const menu = document.querySelector(".user-menu");
    if (menu && !menu.contains(e.target)) {
      document.getElementById("user-dropdown")?.classList.remove("open");
    }
  });

  // ── App ───────────────────────────────────────────────
  function showApp() {
    document.getElementById("header-avatar").textContent = (currentUser || "?")[0].toUpperCase();
    document.getElementById("header-username").textContent = currentUser;
    document.getElementById("dropdown-username").textContent = currentUser;
    showView("app");
    currentPage = 1;
    loadTasks();
  }

  function setFilter(filter, btn) {
    currentFilter = filter; currentPage = 1;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    loadTasks();
  }

  function changePage(delta) {
    currentPage += delta;
    loadTasks();
  }

  async function loadTasks() {
    const container = document.getElementById("task-list-container");
    container.innerHTML = '<div class="loading">Loading…</div>';

    let url = `/tasks?page=${currentPage}&limit=${PAGE_SIZE}`;
    if (currentFilter === "completed") url += "&completed=true";
    if (currentFilter === "pending")   url += "&completed=false";

    const { ok, data } = await apiFetch(url);
    if (!ok) {
      if (data.detail === "Could not validate credentials") { logout(); return; }
      container.innerHTML = '<div class="loading">Failed to load tasks.</div>';
      return;
    }

    const tasks = data.tasks || [];
    const total = data.total || 0;
    const totalPages = Math.ceil(total / PAGE_SIZE);

    // Pending count for header badge
    if (currentFilter === "all") {
      const pending = tasks.filter(t => !t.completed).length;
      updatePendingBadge(pending, total);
    }

    // Count display
    document.getElementById("task-count").textContent = total + " total";

    // Pagination
    const pagEl = document.getElementById("pagination");
    if (totalPages > 1) {
      pagEl.classList.remove("hidden");
      document.getElementById("prev-btn").disabled = currentPage <= 1;
      document.getElementById("next-btn").disabled = currentPage >= totalPages;
      document.getElementById("page-info").textContent = `Page ${currentPage} of ${totalPages}`;
    } else {
      pagEl.classList.add("hidden");
    }

    if (tasks.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">✓</div>
          <p class="empty-text">Nothing here. Go add something.</p>
        </div>`;
      return;
    }

    container.innerHTML = '<div class="task-list" id="task-list"></div>';
    const list = document.getElementById("task-list");
    tasks.forEach(task => list.appendChild(buildTaskEl(task)));
  }

  function buildTaskEl(task) {
    const item = document.createElement("div");
    item.className = "task-item" + (task.completed ? " done" : "");
    item.dataset.id = task.id;

    const dateStr = task.created_at ? task.created_at.slice(0, 10) : "";
    const statusHtml = task.completed
      ? `<span class="status-done">Completed</span>`
      : `<span class="status-pending">Pending</span>`;

    item.innerHTML = `
      <label class="checkbox-wrap">
        <input type="checkbox" ${task.completed ? "checked" : ""}
          onchange="toggleTask(${task.id}, this.checked)" />
        <div class="checkbox-custom">
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="#09090b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </label>
      <div class="task-body">
        <p class="task-title${task.completed ? " done" : ""}">${escHtml(task.title)}</p>
        ${task.description ? `<p class="task-desc">${escHtml(task.description)}</p>` : ""}
        <div class="task-meta">
          ${statusHtml}
          <span class="meta-dot">·</span>
          <span>${dateStr}</span>
        </div>
      </div>
      <button class="task-delete" title="Delete" onclick="deleteTask(${task.id})">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>`;
    return item;
  }

  function updatePendingBadge(pending, total) {
    const badge = document.getElementById("pending-badge");
    if (pending > 0) {
      badge.textContent = pending + " pending";
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  async function createTask() {
    const titleEl = document.getElementById("task-title");
    const descEl  = document.getElementById("task-desc");
    const title = titleEl.value.trim();
    const description = descEl.value.trim();
    if (!title) { titleEl.focus(); return; }

    const { ok, data } = await apiFetch("/tasks", {
      method: "POST",
      body: JSON.stringify({ title, description: description || undefined })
    });
    if (!ok) { alert(data.detail || "Failed to create task"); return; }
    titleEl.value = ""; descEl.value = "";
    currentPage = 1;
    loadTasks();
  }

  async function toggleTask(id, completed) {
    await apiFetch(`/tasks/${id}`, {
      method: "PUT",
      body: JSON.stringify({ completed })
    });
    loadTasks();
  }

  async function deleteTask(id) {
    const { ok } = await apiFetch(`/tasks/${id}`, { method: "DELETE" });
    if (ok) loadTasks();
  }

  // ── Boot ─────────────────────────────────────────────
  if (token && currentUser) {
    showApp();
  } else {
    showView("login");
  }
</script>
</body>
</html>
