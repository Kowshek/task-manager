<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --border: #475569;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --radius: 8px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Layout ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    header span { font-size: 0.875rem; color: var(--text-muted); }

    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    /* ── Cards / Panels ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab-btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* ── Forms ── */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.35rem; }
    input, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    /* ── Buttons ── */
    .btn {
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #16a34a; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    /* ── Alerts ── */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error { background: #450a0a; border: 1px solid var(--danger); color: #fca5a5; }
    .alert-success { background: #052e16; border: 1px solid var(--success); color: #86efac; }

    /* ── Task list ── */
    #task-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .task-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .task-item.completed { opacity: 0.6; }
    .task-item.completed .task-title { text-decoration: line-through; }

    .task-check {
      width: 18px; height: 18px; min-width: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      transition: all 0.15s;
      margin-top: 2px;
    }
    .task-check.done { background: var(--success); border-color: var(--success); }
    .task-check.done::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }

    .task-content { flex: 1; }
    .task-title { font-weight: 600; font-size: 0.95rem; }
    .task-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    .task-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; }

    .task-actions { display: flex; gap: 0.5rem; align-items: center; }

    /* ── Filters ── */
    .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    .filter-bar span { font-size: 0.8rem; color: var(--text-muted); }
    .filter-btn {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Pagination ── */
    .pagination { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; align-items: center; }
    .pagination button {
      padding: 0.4rem 0.85rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.8rem;
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination button.current { background: var(--accent); border-color: var(--accent); }
    .pagination span { font-size: 0.8rem; color: var(--text-muted); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; }

    /* ── Profile dropdown ── */
    .profile-wrapper { position: relative; display: none; }
    .profile-wrapper.visible { display: block; }
    .profile-btn {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.35rem 0.85rem;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .profile-btn:hover { border-color: var(--accent); }
    .profile-avatar {
      width: 24px; height: 24px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; color: #fff;
    }
    .profile-dropdown {
      position: absolute; right: 0; top: calc(100% + 8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
      z-index: 100;
      overflow: hidden;
    }
    .profile-dropdown.open { display: block; }
    .dropdown-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .dropdown-header strong { display: block; color: var(--text); font-size: 0.9rem; margin-bottom: 2px; }
    .dropdown-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      color: var(--text);
      cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
      transition: background 0.1s;
    }
    .dropdown-item:hover { background: var(--surface2); }
    .dropdown-item.danger { color: #ef4444; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .task-item { flex-direction: column; }
      .task-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚡ Task Manager</h1>
  <div class="profile-wrapper" id="profile-wrapper">
    <button class="profile-btn" onclick="toggleDropdown()" id="profile-btn">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <span id="user-info"></span>
      <span style="font-size:0.7rem;color:var(--text-muted);">▾</span>
    </button>
    <div class="profile-dropdown" id="profile-dropdown">
      <div class="dropdown-header">
        <strong id="dropdown-username"></strong>
        Signed in
      </div>
      <button class="dropdown-item danger" onclick="logout()">
        <span>⏻</span> Logout
      </button>
    </div>
  </div>
</header>

<main>
  <!-- ── Auth Section ── -->
  <div id="auth-section">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login -->
    <div id="login-panel" class="card">
      <h2>Login</h2>
      <div id="login-alert" class="alert"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="your_username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" onclick="login()">Login</button>
    </div>

    <!-- Register -->
    <div id="register-panel" class="card" style="display:none;">
      <h2>Create Account</h2>
      <div id="register-alert" class="alert"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="your_username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="min 6 characters" />
      </div>
      <button class="btn btn-primary" onclick="register()">Create Account</button>
    </div>
  </div>

  <!-- ── App Section ── -->
  <div id="app-section" style="display:none;">

    <!-- Create Task -->
    <div class="card">
      <h2>New Task</h2>
      <div id="create-alert" class="alert"></div>
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="task-title" placeholder="What needs to be done?" />
      </div>
      <div class="form-group">
        <label>Description (optional)</label>
        <textarea id="task-desc" placeholder="Add details..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="createTask()">Add Task</button>
    </div>

    <!-- Task List -->
    <div class="card">
      <h2>My Tasks <span id="task-count" style="font-weight:400;font-size:0.85rem;"></span></h2>

      <div class="filter-bar">
        <span>Filter:</span>
        <button class="filter-btn active" onclick="setFilter(null, this)">All</button>
        <button class="filter-btn" onclick="setFilter(false, this)">Pending</button>
        <button class="filter-btn" onclick="setFilter(true, this)">Completed</button>
      </div>

      <div id="task-list"><div class="empty">Loading...</div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>

<script>
  // ── Config ──────────────────────────────────────────────────────────
  // In production on Render, the API and frontend share the same origin,
  // so an empty base URL works. For local dev where backend runs on :8000
  // and you open index.html directly, change this to 'http://localhost:8000'
  const API = window.location.hostname === 'localhost' && window.location.port !== '8000'
    ? 'http://localhost:8000'
    : '';

  // ── State ────────────────────────────────────────────────────────────
  let token = localStorage.getItem('tm_token') || null;
  let currentUser = localStorage.getItem('tm_user') || null;
  let currentFilter = null;  // null=all, false=pending, true=completed
  let currentPage = 1;
  const PAGE_LIMIT = 5;

  // ── Boot ─────────────────────────────────────────────────────────────
  window.onload = () => {
    if (token) showApp();
  };

  // ── Tabs ─────────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('login-panel').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('register-panel').style.display = tab === 'register' ? '' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
  }

  // ── Auth helpers ──────────────────────────────────────────────────────
  function showAlert(id, message, type = 'error') {
    const el = document.getElementById(id);
    // Pydantic validation errors return detail as an array of objects
    if (Array.isArray(message)) {
      message = message.map(e => e.msg || JSON.stringify(e)).join(', ');
    } else if (typeof message === 'object' && message !== null) {
      message = message.msg || JSON.stringify(message);
    }
    el.textContent = message;
    el.className = `alert alert-${type} show`;
  }
  function hideAlert(id) {
    document.getElementById(id).className = 'alert';
  }

  async function apiFetch(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${API}${path}`, { ...options, headers });
    const data = res.status === 204 ? null : await res.json();
    return { ok: res.ok, status: res.status, data };
  }

  // ── Register ──────────────────────────────────────────────────────────
  async function register() {
    hideAlert('register-alert');
    const username = document.getElementById('reg-username').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    if (!username || !email || !password) {
      return showAlert('register-alert', 'All fields are required.');
    }

    const { ok, data } = await apiFetch('/register', {
      method: 'POST',
      body: JSON.stringify({ username, email, password }),
    });

    if (ok) {
      showAlert('register-alert', `Account created! Welcome, ${data.username}. Please login.`, 'success');
      setTimeout(() => switchTab('login'), 1500);
    } else {
      showAlert('register-alert', data.detail || 'Registration failed.');
    }
  }

  // ── Login ────────────────────────────────────────────────────────────
  async function login() {
    hideAlert('login-alert');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    if (!username || !password) {
      return showAlert('login-alert', 'Username and password required.');
    }

    const { ok, data } = await apiFetch('/login', {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });

    if (ok) {
      token = data.access_token;
      currentUser = username;
      localStorage.setItem('tm_token', token);
      localStorage.setItem('tm_user', username);
      showApp();
    } else {
      showAlert('login-alert', data.detail || 'Login failed.');
    }
  }

  // ── Profile dropdown ─────────────────────────────────────────────────
  function toggleDropdown() {
    document.getElementById('profile-dropdown').classList.toggle('open');
  }
  // Close dropdown if clicking outside
  document.addEventListener('click', e => {
    const btn = document.getElementById('profile-btn');
    const dd  = document.getElementById('profile-dropdown');
    if (dd && !btn?.contains(e.target)) dd.classList.remove('open');
  });

  // ── Logout ───────────────────────────────────────────────────────────
  function logout() {
    token = null; currentUser = null;
    localStorage.removeItem('tm_token');
    localStorage.removeItem('tm_user');
    document.getElementById('auth-section').style.display = '';
    document.getElementById('app-section').style.display = 'none';
    document.getElementById('profile-wrapper').classList.remove('visible');
    document.getElementById('profile-dropdown').classList.remove('open');
    document.getElementById('user-info').textContent = '';
  }

  // ── Show App ─────────────────────────────────────────────────────────
  function showApp() {
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('app-section').style.display = '';
    document.getElementById('profile-wrapper').classList.add('visible');
    document.getElementById('user-info').textContent = currentUser;
    document.getElementById('dropdown-username').textContent = currentUser;
    // Avatar: first letter of username
    document.getElementById('profile-avatar').textContent = currentUser.charAt(0).toUpperCase();
    loadTasks();
  }

  // ── Create Task ───────────────────────────────────────────────────────
  async function createTask() {
    hideAlert('create-alert');
    const title = document.getElementById('task-title').value.trim();
    const description = document.getElementById('task-desc').value.trim() || null;

    if (!title) return showAlert('create-alert', 'Title is required.');

    const { ok, data } = await apiFetch('/tasks', {
      method: 'POST',
      body: JSON.stringify({ title, description }),
    });

    if (ok) {
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      showAlert('create-alert', 'Task created!', 'success');
      setTimeout(() => hideAlert('create-alert'), 1500);
      currentPage = 1;
      loadTasks();
    } else if (data?.detail === 'Invalid or expired token') {
      logout();
    } else {
      showAlert('create-alert', data?.detail || 'Failed to create task.');
    }
  }

  // ── Load Tasks ────────────────────────────────────────────────────────
  async function loadTasks() {
    let url = `/tasks?page=${currentPage}&limit=${PAGE_LIMIT}`;
    if (currentFilter !== null) url += `&completed=${currentFilter}`;

    const { ok, data } = await apiFetch(url);
    if (!ok) { if (data?.detail === 'Invalid or expired token') logout(); return; }

    renderTasks(data);
  }

  function renderTasks({ tasks, total, page, limit }) {
    const list = document.getElementById('task-list');
    const totalPages = Math.ceil(total / limit) || 1;

    document.getElementById('task-count').textContent = `(${total} total)`;

    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty">No tasks here. Go create one! 🎯</div>';
    } else {
      list.innerHTML = tasks.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${task.id}">
          <div class="task-check ${task.completed ? 'done' : ''}" onclick="toggleTask(${task.id}, ${task.completed})"></div>
          <div class="task-content">
            <div class="task-title">${escHtml(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escHtml(task.description)}</div>` : ''}
            <div class="task-meta">
              ${task.completed ? '✅ Completed' : '🕐 Pending'} &nbsp;·&nbsp;
              Created ${formatDate(task.created_at)}
            </div>
          </div>
          <div class="task-actions">
            <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Pagination
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }

    pag.innerHTML = `
      <button onclick="goPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← Prev</button>
      <span>Page ${page} of ${totalPages}</span>
      <button onclick="goPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Next →</button>
    `;
  }

  // ── Toggle Complete ───────────────────────────────────────────────────
  async function toggleTask(id, currentlyCompleted) {
    const { ok, data } = await apiFetch(`/tasks/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ completed: !currentlyCompleted }),
    });
    if (ok) loadTasks();
    else if (data?.detail === 'Invalid or expired token') logout();
  }

  // ── Delete Task ───────────────────────────────────────────────────────
  async function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    const { ok, status } = await apiFetch(`/tasks/${id}`, { method: 'DELETE' });
    if (ok || status === 204) {
      if (currentPage > 1) currentPage--;
      loadTasks();
    }
  }

  // ── Filter ───────────────────────────────────────────────────────────
  function setFilter(value, btn) {
    currentFilter = value;
    currentPage = 1;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadTasks();
  }

  // ── Pagination ────────────────────────────────────────────────────────
  function goPage(p) {
    currentPage = p;
    loadTasks();
  }

  // ── Utilities ─────────────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  // ── Enter key shortcuts ───────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('login-panel').style.display !== 'none' &&
          document.getElementById('auth-section').style.display !== 'none') login();
    }
  });
</script>
</body>
</html>
